<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DSGames Admin</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f7fb;margin:0;color:#111}.wrap{max-width:1100px;margin:28px auto;padding:0 18px}.card{background:#fff;border-radius:20px;padding:20px;margin:16px 0;box-shadow:0 8px 30px #0000000d}h1{margin-bottom:6px}p{color:#68707d}.note{background:#fff8df;border:1px solid #f2dc8c;padding:12px 14px;border-radius:12px;color:#695500}.successBox{background:#edfdf3;border:1px solid #b8ebca;padding:14px;border-radius:14px;margin:12px 0;word-break:break-all}.ok{color:#14823b}.err{color:#c62828}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}input,textarea,select{width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid #d9dee7;border-radius:11px;margin-top:6px;margin-bottom:12px;font:inherit}label{font-weight:600;font-size:14px}.game,.keyrow{border:1px solid #e1e6ef;border-radius:16px;padding:15px;margin:12px 0}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button{border:0;border-radius:11px;padding:11px 15px;font-weight:700;cursor:pointer}button.primary{background:#1677ff;color:white}button.green{background:#18a957;color:white}button.danger{background:#ffe8e8;color:#c62828}button.gray{background:#edf1f6}.upload{border:1px dashed #aeb8c8;padding:14px;border-radius:13px;background:#fafcff}.progress{height:8px;background:#e9edf4;border-radius:8px;overflow:hidden;margin:8px 0}.bar{height:100%;width:0;background:#1677ff}.small{font-size:12px;color:#68707d}.pill{display:inline-block;border-radius:99px;padding:4px 9px;font-size:12px;font-weight:700;background:#eef3f8}.pill.on{background:#e8f8ed;color:#13813a}.pill.off{background:#ffecec;color:#bb2525}.muted{color:#68707d}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style></head>
<body><div class="wrap">
<h1>DSGames Admin</h1>
<p>Quản lý Key, game, IPA và dữ liệu tự đồng bộ vào ứng dụng DSGames.</p>
<div class="note"><b>Bảo mật Key:</b> DSGames chỉ lưu SHA-256 của Key trong <code>keys.json</code>. Key đầy đủ chỉ hiện một lần khi Admin tạo. Hãy copy ngay và không commit GitHub token vào repository.</div>

<div class="card"><h2>GitHub</h2>
<div class="grid"><div><label>Owner</label><input id="owner" value="hieuvlog2001-creator"></div><div><label>Repository</label><input id="repo" value="DSGAME"></div></div>
<div class="grid"><div><label>Branch</label><input id="branch" value="main"></div><div><label>Game manifest</label><input id="path" value="games.json"></div></div>
<label>GitHub token (chỉ dùng trong trình duyệt)</label><input id="token" type="password" placeholder="github_pat_...">
<div class="actions"><button class="primary" onclick="loadAll()">Tải dữ liệu</button><span id="status"></span></div>
</div>

<div class="card"><h2>Quản lý Key</h2>
<div class="grid">
<div><label>Ghi chú / khách hàng</label><input id="keyNote" placeholder="Ví dụ: Khách A"></div>
<div><label>Thời hạn</label><select id="keyDuration"><option value="1">1 giờ</option><option value="24" selected>1 ngày</option><option value="168">7 ngày</option><option value="720">30 ngày</option><option value="2160">90 ngày</option><option value="0">Vĩnh viễn</option></select></div>
</div>
<div class="actions"><button class="green" onclick="generateKey()">＋ Tạo Key</button><button class="primary" onclick="saveKeys()">Lưu keys.json</button><span id="keyStatus" class="small"></span></div>
<div id="generatedKey"></div>
<div id="keyList"></div>
</div>

<div class="card"><h2>Danh sách game</h2><div id="list"></div>
<button class="gray" onclick="addGame()">＋ Thêm game</button>
<button class="primary" onclick="saveGames()" style="margin-left:8px">Lưu games.json</button>
</div>
</div>
<script>
let manifest={version:1,updatedAt:new Date().toISOString(),games:[]},sha='';
let keyManifest={version:1,updatedAt:new Date().toISOString(),licenses:[]},keysSha='';
const $=id=>document.getElementById(id);
const status=t=>{$('status').textContent=t};
function cfg(){return {owner:$('owner').value.trim(),repo:$('repo').value.trim(),branch:$('branch').value.trim()||'main',path:$('path').value.trim()||'games.json',token:$('token').value.trim()}}
function headers(c){return {Authorization:`Bearer ${c.token}`,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}}
function ghRaw(c,path){return `https://raw.githubusercontent.com/${c.owner}/${c.repo}/${c.branch}/${path}`}
function enc64(text){return btoa(unescape(encodeURIComponent(text)))}
function dec64(text){return decodeURIComponent(escape(atob(text.replace(/\n/g,''))))}
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function xml(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;')}
function safe(s){return String(s).replace(/[^A-Za-z0-9._-]/g,'-').slice(0,70)}

async function loadAll(){await loadGames();await loadKeys()}
async function getContent(c,path){return fetch(`https://api.github.com/repos/${c.owner}/${c.repo}/contents/${path}?ref=${encodeURIComponent(c.branch)}`,{headers:headers(c)})}

async function loadGames(){let c=cfg();if(!c.owner||!c.repo||!c.token)return status(' — nhập đủ Owner/Repo/Token');status(' — đang tải...');try{let r=await getContent(c,c.path);if(!r.ok)throw new Error(await r.text());let j=await r.json();sha=j.sha;manifest=JSON.parse(dec64(j.content));render();status(' — đã tải games.json')}catch(e){status(' — lỗi games.json: '+e.message)}}

async function loadKeys(){let c=cfg();if(!c.owner||!c.repo||!c.token)return;$('keyStatus').textContent='Đang tải keys.json...';try{let r=await getContent(c,'keys.json');if(r.status===404){keyManifest={version:1,updatedAt:new Date().toISOString(),licenses:[]};keysSha='';renderKeys();$('keyStatus').textContent='Chưa có keys.json — bấm Lưu keys.json để tạo.';return}if(!r.ok)throw new Error(await r.text());let j=await r.json();keysSha=j.sha;keyManifest=JSON.parse(dec64(j.content));renderKeys();$('keyStatus').textContent='Đã tải keys.json'}catch(e){$('keyStatus').textContent='Lỗi: '+e.message}}

async function sha256(text){const data=new TextEncoder().encode(text);const hash=await crypto.subtle.digest('SHA-256',data);return [...new Uint8Array(hash)].map(b=>b.toString(16).padStart(2,'0')).join('')}
function randomPart(len=4){const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';const a=new Uint8Array(len);crypto.getRandomValues(a);return [...a].map(x=>chars[x%chars.length]).join('')}
function makeKey(){return `DSG-${randomPart()}-${randomPart()}-${randomPart()}-${randomPart()}`}

async function generateKey(){
 const key=makeKey(),hash=await sha256(key),hours=Number($('keyDuration').value||0),now=new Date();
 const expiresAt=hours>0?new Date(now.getTime()+hours*3600000).toISOString():null;
 keyManifest.licenses.unshift({id:crypto.randomUUID?crypto.randomUUID():'key-'+Date.now(),keyHash:hash,note:$('keyNote').value.trim(),createdAt:now.toISOString(),expiresAt,enabled:true});
 $('generatedKey').innerHTML=`<div class="successBox"><b>Key mới — chỉ hiện lần này:</b><br><code id="newKeyText">${esc(key)}</code><div class="actions" style="margin-top:10px"><button class="green" onclick="navigator.clipboard.writeText(document.getElementById('newKeyText').textContent)">Copy Key</button></div></div>`;
 $('keyNote').value='';renderKeys();
}
function fmtDate(x){if(!x)return 'Vĩnh viễn';try{return new Date(x).toLocaleString('vi-VN')}catch{return x}}
function renderKeys(){
 const now=Date.now();
 $('keyList').innerHTML=(keyManifest.licenses||[]).map((k,i)=>{const expired=k.expiresAt&&new Date(k.expiresAt).getTime()<=now;const active=k.enabled&&!expired;return `<div class="keyrow">
 <div class="grid"><div><b>${esc(k.note||'Không ghi chú')}</b><div class="small">ID: ${esc(k.id)}</div></div><div><span class="pill ${active?'on':'off'}">${active?'ACTIVE':expired?'HẾT HẠN':'ĐÃ KHÓA'}</span></div></div>
 <p class="small">Tạo: ${fmtDate(k.createdAt)}<br>Hết hạn: ${fmtDate(k.expiresAt)}<br>Hash: ${esc((k.keyHash||'').slice(0,16))}…</p>
 <label><input style="width:auto;margin:0 7px 0 0" type="checkbox" ${k.enabled?'checked':''} onchange="keyManifest.licenses[${i}].enabled=this.checked;renderKeys()"> Cho phép sử dụng</label>
 <div class="actions" style="margin-top:10px"><button class="danger" onclick="deleteKey(${i})">Xoá Key</button></div></div>`}).join('')||'<p class="muted">Chưa có Key nào.</p>';
}
function deleteKey(i){if(confirm('Xoá Key này? Thiết bị đang dùng Key sẽ bị khóa ở lần kiểm tra tiếp theo.')){keyManifest.licenses.splice(i,1);renderKeys()}}

async function saveKeys(){
 let c=cfg();if(!c.owner||!c.repo||!c.token)return $('keyStatus').textContent='Nhập Owner/Repo/Token trước.';
 keyManifest.version=(keyManifest.version||0)+1;keyManifest.updatedAt=new Date().toISOString();
 const body={message:'Update DSGames keys.json',content:enc64(JSON.stringify(keyManifest,null,2)+'\n'),branch:c.branch};if(keysSha)body.sha=keysSha;
 $('keyStatus').textContent='Đang lưu...';try{let r=await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}/contents/keys.json`,{method:'PUT',headers:{...headers(c),'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw new Error(await r.text());let j=await r.json();keysSha=j.content.sha;$('keyStatus').textContent='Đã lưu. App sẽ tự kiểm tra Key mới.'}catch(e){$('keyStatus').textContent='Lỗi: '+e.message}
}

function addGame(){manifest.games.push({id:'game-'+Date.now(),name:'Game mới',subtitle:'Mở game',color:'cyan',iconURL:'',launchURL:'',urlScheme:'',info:'',version:'1.0.0',bundleId:'',ipaURL:'',manifestURL:'',enabled:true});render()}
function render(){
$('list').innerHTML=manifest.games.map((g,i)=>`<div class="game">
<div class="grid"><div><label>ID</label><input data-i="${i}" data-k="id" value="${esc(g.id)}"></div><div><label>Tên game</label><input data-i="${i}" data-k="name" value="${esc(g.name)}"></div><div><label>Bundle ID</label><input data-i="${i}" data-k="bundleId" placeholder="com.example.game" value="${esc(g.bundleId||'')}"></div><div><label>Version</label><input data-i="${i}" data-k="version" placeholder="1.0.0" value="${esc(g.version||'')}"></div><div><label>Phụ đề</label><input data-i="${i}" data-k="subtitle" value="${esc(g.subtitle||'')}"></div><div><label>Màu</label><select data-i="${i}" data-k="color"><option ${g.color==='green'?'selected':''}>green</option><option ${g.color==='orange'?'selected':''}>orange</option><option ${g.color==='red'?'selected':''}>red</option><option ${g.color==='yellow'?'selected':''}>yellow</option><option ${g.color==='cyan'?'selected':''}>cyan</option></select></div><div><label>Icon URL</label><input data-i="${i}" data-k="iconURL" value="${esc(g.iconURL||'')}"></div><div><label>Launch URL / Deep Link</label><input data-i="${i}" data-k="launchURL" placeholder="game://" value="${esc(g.launchURL||'')}"></div><div><label>URL Scheme</label><input data-i="${i}" data-k="urlScheme" placeholder="game" value="${esc(g.urlScheme||'')}"></div></div>
<label>Mô tả</label><textarea data-i="${i}" data-k="info">${esc(g.info||'')}</textarea>
<div class="upload"><label>IPA đã ký</label><input type="file" accept=".ipa,application/octet-stream" onchange="uploadIPA(${i},this)"><div class="small">Upload qua GitHub Releases. IPA phải được ký/cài hợp lệ trên thiết bị.</div><div class="progress"><div class="bar" id="bar-${i}"></div></div><div id="upload-${i}" class="small">${g.ipaURL?'Đã có IPA: '+esc(g.version||''):'Chưa có IPA'}</div></div>
<p class="small">IPA URL: ${esc(g.ipaURL||'')}<br>Manifest URL: ${esc(g.manifestURL||'')}</p><label><input style="width:auto;margin:0 7px 0 0" type="checkbox" data-i="${i}" data-k="enabled" ${g.enabled?'checked':''}> Hiển thị trong app</label><div class="actions"><button class="danger" onclick="removeGame(${i})">Xoá game</button></div></div>`).join('');
document.querySelectorAll('[data-i]').forEach(el=>el.addEventListener('input',sync));document.querySelectorAll('[data-k="enabled"]').forEach(el=>el.addEventListener('change',sync))}
function sync(e){let i=+e.target.dataset.i,k=e.target.dataset.k;manifest.games[i][k]=e.target.type==='checkbox'?e.target.checked:e.target.value}
function removeGame(i){if(confirm('Xoá game này khỏi games.json?')){manifest.games.splice(i,1);render()}}

async function uploadIPA(i,input){
 const file=input.files&&input.files[0];if(!file)return;const c=cfg(),g=manifest.games[i];if(!c.owner||!c.repo||!c.token){alert('Nhập Owner, Repository và Token trước.');input.value='';return}if(!g.id||!g.name||!g.bundleId||!g.version){alert('Hãy điền ID, tên, Bundle ID và Version trước khi upload.');input.value='';return}
 const bar=$(`bar-${i}`),out=$(`upload-${i}`);out.textContent='Đang tạo GitHub Release...';bar.style.width='5%';try{const tag=`dsgames-${safe(g.id)}-${safe(g.version)}-${Date.now()}`;let r=await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}/releases`,{method:'POST',headers:{...headers(c),'Content-Type':'application/json'},body:JSON.stringify({tag_name:tag,name:`${g.name} ${g.version}`,body:`DSGames IPA ${g.name} ${g.version}`,draft:false,prerelease:false})});if(!r.ok)throw new Error(await r.text());const rel=await r.json();bar.style.width='15%';const assetName=safe(file.name.endsWith('.ipa')?file.name:file.name+'.ipa');r=await fetch(`${rel.upload_url.split('{')[0]}?name=${encodeURIComponent(assetName)}`,{method:'POST',headers:{...headers(c),'Content-Type':'application/octet-stream'},body:file});if(!r.ok)throw new Error(await r.text());const asset=await r.json();bar.style.width='75%';g.ipaURL=asset.browser_download_url;g.manifestURL=ghRaw(c,`ota/${encodeURIComponent(g.id)}.plist`);await putManifestPlist(c,g);bar.style.width='100%';out.textContent='Upload thành công: '+g.ipaURL;render()}catch(e){bar.style.width='0';out.textContent='Lỗi upload: '+e.message;out.className='small err'}
}
async function putManifestPlist(c,g){const plist=`<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0"><dict><key>items</key><array><dict><key>assets</key><array><dict><key>kind</key><string>software-package</string><key>url</key><string>${xml(g.ipaURL)}</string></dict>${g.iconURL?`<dict><key>kind</key><string>display-image</string><key>url</key><string>${xml(g.iconURL)}</string></dict>`:''}</array><key>metadata</key><dict><key>bundle-identifier</key><string>${xml(g.bundleId)}</string><key>bundle-version</key><string>${xml(g.version)}</string><key>kind</key><string>software</string><key>title</key><string>${xml(g.name)}</string></dict></dict></array></dict></plist>`;const path=`ota/${g.id}.plist`,url=`https://api.github.com/repos/${c.owner}/${c.repo}/contents/${path}`;let old=await fetch(`${url}?ref=${encodeURIComponent(c.branch)}`,{headers:headers(c)}),oldSha='';if(old.ok){let j=await old.json();oldSha=j.sha}const body={message:`Add OTA manifest for ${g.name} ${g.version}`,content:enc64(plist),branch:c.branch};if(oldSha)body.sha=oldSha;const r=await fetch(url,{method:'PUT',headers:{...headers(c),'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw new Error(await r.text())}
async function saveGames(){let c=cfg();if(!c.owner||!c.repo||!c.token||!sha)return status(' — hãy tải games.json trước');manifest.version=(manifest.version||0)+1;manifest.updatedAt=new Date().toISOString();status(' — đang lưu...');try{let r=await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}/contents/${c.path}`,{method:'PUT',headers:{...headers(c),'Content-Type':'application/json'},body:JSON.stringify({message:'Update games.json from DSGames Admin',content:enc64(JSON.stringify(manifest,null,2)+'\n'),sha,branch:c.branch})});if(!r.ok)throw new Error(await r.text());let j=await r.json();sha=j.content.sha;status(' — đã lưu thành công; app sẽ tự đồng bộ')}catch(e){status(' — lỗi: '+e.message)}}
render();renderKeys();
</script></body></html>
