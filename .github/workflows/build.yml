name: Build DSGames IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Show Xcode and schemes
        run: |
          xcodebuild -project DSGames.xcodeproj -list

      - name: Build unsigned app
        run: |
          set -e
          rm -rf build Payload DSGames-unsigned.ipa
          xcodebuild \
            -project DSGames.xcodeproj \
            -scheme DSGames \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$PWD/build" \
            PRODUCT_NAME=DSGames \
            EXECUTABLE_NAME=DSGames \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Verify built app
        run: |
          set -e
          APP="build/Build/Products/Release-iphoneos/DSGames.app"
          test -d "$APP"
          test -f "$APP/Info.plist"
          test -f "$APP/DSGames"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          echo "Built: $APP"

      - name: Package IPA
        run: |
          set -e
          rm -rf Payload
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/DSGames.app Payload/DSGames.app
          /usr/bin/zip -qry DSGames-unsigned.ipa Payload
          test -s DSGames-unsigned.ipa
          unzip -l DSGames-unsigned.ipa | head -30

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DSGames-unsigned-IPA
          path: DSGames-unsigned.ipa
          if-no-files-found: error
